name: Publish GitHub Pages (opt-in)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  publish:
    # Disabled until owner selects Pages Source: GitHub Actions
    # and enables repository variable PAGES_ACTIONS_ENABLED=true.
    if: vars.PAGES_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test research and policy rules
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify page and index safeguards
        run: npm run check:build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public dist only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
